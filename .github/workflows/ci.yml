name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  linux:
    runs-on: ubuntu-latest
    env:
      # The tests that start a tmux of their own (allow-passthrough, --config)
      # skip themselves when there is none. Here that is an error.
      TMUX_SHIM_REQUIRE_TMUX: "1"
    steps:
      - uses: actions/checkout@v4
      - name: Install tmux
        run: |
          command -v tmux >/dev/null || { sudo apt-get update && sudo apt-get install -y tmux; }
          tmux -V
      - run: cargo fmt --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked

  # The oldest Rust that the program says it builds with (rust-version in Cargo.toml).
  msrv:
    runs-on: ubuntu-latest
    env:
      TMUX_SHIM_REQUIRE_TMUX: "1"
    steps:
      - uses: actions/checkout@v4
      - name: Install tmux
        run: command -v tmux >/dev/null || { sudo apt-get update && sudo apt-get install -y tmux; }
      - name: Read rust-version
        id: msrv
        run: echo "version=$(sed -n 's/^rust-version *= *"\(.*\)"/\1/p' Cargo.toml)" >> "$GITHUB_OUTPUT"
      - run: rustup toolchain install ${{ steps.msrv.outputs.version }} --profile minimal
      - run: cargo +${{ steps.msrv.outputs.version }} test --locked

  # The binary that the release workflow publishes: static, and it works.
  static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup target add x86_64-unknown-linux-musl
      - run: cargo build --release --locked --target x86_64-unknown-linux-musl
      - name: Static, and it runs
        run: |
          bin=target/x86_64-unknown-linux-musl/release/tmux-shim
          file "$bin" | grep -E "static(-pie)? linked"
          "$bin" --version
          env -u TMUX -u STY "$bin" -- echo ok | grep -x ok

  # The same on Linux arm64: the tests, and the static binary. The release does not
  # publish an aarch64 binary (yet); this keeps the code and the build working there.
  linux-arm:
    runs-on: ubuntu-24.04-arm
    env:
      TMUX_SHIM_REQUIRE_TMUX: "1"
    steps:
      - uses: actions/checkout@v4
      - name: Install tmux
        run: |
          command -v tmux >/dev/null || { sudo apt-get update && sudo apt-get install -y tmux; }
          tmux -V
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked
      - run: rustup target add aarch64-unknown-linux-musl
      - run: cargo build --release --locked --target aarch64-unknown-linux-musl
      - name: Static, and it runs
        run: |
          bin=target/aarch64-unknown-linux-musl/release/tmux-shim
          # "static-pie linked" on x86_64, "statically linked" when it is not a PIE.
          file "$bin"
          file "$bin" | grep -E "static(-pie|ally)? linked"
          "$bin" --version
          env -u TMUX -u STY "$bin" -- echo ok | grep -x ok

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      # The tests that run programs on a pty use GNU options of dd, head and
      # stty: only the filter's own tests run here.
      - run: cargo build --locked
      - run: cargo test --locked --bin tmux-shim
