name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cargo fmt --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      # The tests that run programs on a pty use GNU options of dd, head and
      # stty: only the filter's own tests run here.
      - run: cargo build --locked
      - run: cargo test --locked --bin tmux-shim
